<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fantasy HQ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<style>
  :root {
    --bg: #f4f5f7; --card: #ffffff; --ink: #15181d; --muted: #667085; --line: #e4e7ec;
    --accent: #1d6f42; --accent-soft: #e6f4ec; --bad: #b42318; --bad-soft: #fdecea; --warn: #9a6700; --warn-soft: #fff6db;
    --espn: #c8102e; --sleeper: #2d6ae3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --card: #181c22; --ink: #e8eaed; --muted: #98a2b3; --line: #2a3039;
      --accent: #4cc38a; --accent-soft: #15301f; --bad: #f97066; --bad-soft: #3a1714; --warn: #f5c451; --warn-soft: #3a2f10;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1100px; margin: 0 auto; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 22px; margin: 0; }
  .sub { color: var(--muted); font-size: 13px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; padding: 5px 12px; cursor: pointer; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 40px; }
  .todo { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .todo h2 { font-size: 15px; margin: 0 0 8px; }
  .todo ul { margin: 0; padding-left: 18px; }
  .todo li { margin: 3px 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .card-head { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); }
  .card-head .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .card-head h3 { margin: 0; font-size: 16px; }
  .card-head a { color: inherit; text-decoration: none; }
  .tag { font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 99px; color: #fff; text-transform: uppercase; letter-spacing: .03em; }
  .tag.espn { background: var(--espn); } .tag.sleeper { background: var(--sleeper); } .tag.keeper { background: var(--accent); }
  .score { display: flex; justify-content: space-between; margin-top: 8px; font-size: 14px; }
  .score b { font-size: 18px; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); overflow-x: auto; }
  .tabs button { border: 0; border-radius: 0; background: none; padding: 9px 10px; font-size: 14px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .pane { padding: 12px 16px 16px; }
  .pane h4 { margin: 12px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .pane h4:first-child { margin-top: 0; }
  .alert { padding: 7px 10px; border-radius: 8px; margin: 5px 0; font-size: 14px; }
  .alert.bad { background: var(--bad-soft); color: var(--bad); } .alert.warn { background: var(--warn-soft); color: var(--warn); }
  .ok { color: var(--accent); font-size: 14px; }
  .move { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--line); font-size: 14px; flex-wrap: wrap; }
  .in { color: var(--accent); font-weight: 600; } .out { color: var(--muted); text-decoration: line-through; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { padding: 4px 4px; text-align: left; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr.me td { font-weight: 600; background: var(--accent-soft); }
  tr.chg td { color: var(--accent); font-weight: 600; }
  tr.out-row td { color: var(--bad); }
  .pos { display: inline-block; min-width: 34px; font-size: 11px; color: var(--muted); }
  .inj { font-size: 11px; font-weight: 700; color: var(--bad); margin-left: 4px; }
  .trade { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 8px 0; }
  .trade .sides { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 14px; }
  .trade .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .trade p { margin: 8px 0 0; font-size: 13px; color: var(--muted); }
  .kp { font-size: 11px; color: var(--muted); display: block; }
  .err { color: var(--bad); padding: 12px 16px; }
  .muted { color: var(--muted); font-size: 13px; }
  #loading { text-align: center; padding: 60px 0; color: var(--muted); }
  .ask { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .ask h2 { font-size: 15px; margin: 0 0 8px; }
  .ask .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .ask select { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); max-width: 100%; }
  .ask textarea { width: 100%; min-height: 64px; margin: 8px 0; font: inherit; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
  .ask button.go { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  .msg { padding: 8px 10px; border-radius: 8px; margin: 8px 0; font-size: 14px; white-space: pre-wrap; }
  .msg.you { background: var(--bg); }
  .msg.claude { background: var(--accent-soft); }
  nav.views { display: flex; gap: 4px; max-width: 1100px; margin: 0 auto; padding: 0 16px 8px; }
  nav.views button { border-radius: 99px; padding: 5px 14px; }
  nav.views button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .win { display: flex; height: 6px; border-radius: 99px; overflow: hidden; margin-top: 6px; background: var(--bad-soft); }
  .win > div { background: var(--accent); }
  .pct { font-weight: 700; }
  .pct.up { color: var(--accent); } .pct.down { color: var(--bad); }
  a.team, button.team { color: inherit; background: none; border: 0; padding: 0; font: inherit; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .switch { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .switch select { font: inherit; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); flex: 1; min-width: 0; }
  .mu-head { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; text-align: center; }
  .mu-head .big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  table.mu td { vertical-align: top; }
  table.mu td.slot { text-align: center; color: var(--muted); font-size: 12px; width: 52px; }
  table.mu .g { display: block; font-size: 11px; color: var(--muted); }
  table.mu .p { font-weight: 700; font-variant-numeric: tabular-nums; }
  table.mu td.r { text-align: right; }
  .live { color: var(--warn); }
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }
  .tcard { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--card); }
  .tcard.mine { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .tcard h3 { margin: 0; font-size: 15px; }
  .chip { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 99px; margin: 4px 4px 0 0; }
  .chip.need { background: var(--bad-soft); color: var(--bad); } .chip.deep { background: var(--accent-soft); color: var(--accent); } .chip.partner { background: var(--warn-soft); color: var(--warn); }
  .posrow { display: grid; grid-template-columns: 34px 1fr; gap: 6px; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .posrow.weak { background: var(--bad-soft); margin: 0 -12px; padding: 5px 12px; }
  .posrow .lbl2 { font-weight: 700; color: var(--muted); }
  .posrow .rk { font-size: 11px; color: var(--muted); display: block; font-weight: 400; }
  .posrow span.pl { white-space: nowrap; margin-right: 8px; }
  .posrow span.pl.st { font-weight: 600; }
  dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); width: min(560px, calc(100vw - 32px)); max-height: 85vh; padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog .dh { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); }
  dialog .db { padding: 8px 16px 16px; }
  .trade .askbtn { margin-top: 8px; font-size: 13px; padding: 3px 10px; }
</style>
</head>
<body>
<header>
  <h1>🏈 Fantasy HQ</h1>
  <span class="sub" id="meta"></span>
  <button id="refresh" style="margin-left:auto">Refresh</button>
</header>
<nav class="views"><button data-v="home" class="on">Dashboard</button><button data-v="matchups">Matchups</button><button data-v="trades">Trade view</button></nav>
<dialog id="roster"><div class="dh"><b id="rtitle"></b><button id="rclose">Close</button></div><div class="db" id="rbody"></div></dialog>
<main>
  <div id="loading">Pulling your 6 leagues…</div>
  <section class="ask" id="ask" hidden>
    <h2>💬 Ask Claude</h2>
    <div class="muted" id="askhelp">Paste a trade offer you got, or ask anything about one of your leagues. Claude sees every roster in that league.</div>
    <div id="thread"></div>
    <textarea id="q" placeholder="e.g. I was offered Kenneth Walker for Tet McMillan and James Cook. Should I take it?"></textarea>
    <div class="row"><select id="lg"></select><button class="go" id="send">Ask</button><button id="clear">New chat</button></div>
    <div class="muted" id="copied" style="margin-top:8px"></div>
  </section>
  <div id="app"></div>
  <div id="mview" hidden></div>
  <div id="tview" hidden></div>
</main>
<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const num = (n) => (n == null ? '–' : Number(n).toFixed(1));
const rec = (t) => `${t.wins}-${t.losses}${t.ties ? '-' + t.ties : ''}`;
const ago = (ms) => { const h = (Date.now() - ms) / 36e5; return h < 1 ? 'just now' : h < 24 ? `${Math.round(h)}h ago` : `${Math.round(h / 24)}d ago`; };

function player(p, extra = '') {
  if (!p) return '<span class="muted">empty</span>';
  return `<span class="pos">${esc(p.pos)}</span>${esc(p.name)} <span class="muted">${esc(p.nfl || '')}</span>${p.injury ? `<span class="inj">${esc(p.injury)}</span>` : ''}${extra}`;
}

function overview(L) {
  let h = '<h4>Heads up</h4>';
  h += L.alerts.length ? L.alerts.map((a) => `<div class="alert ${a.level}">${esc(a.text)}</div>`).join('') : '<div class="ok">✓ No injury or bye problems in your lineup</div>';
  h += '<h4>Lineup moves this week</h4>';
  if (L.lineup.moves.length) {
    h += L.lineup.moves.map((m) => `<div class="move"><span class="in">▲ Start ${esc(m.in.name)}</span> <span class="muted">(${num(m.in.proj)})</span>${m.out ? ` <span class="out">${esc(m.out.name)}</span> <span class="muted">(${num(m.out.proj)})</span>` : ''}</div>`).join('');
    h += `<div class="muted" style="margin-top:6px">About +${num(L.lineup.gain)} projected points.</div>`;
  } else h += '<div class="ok">✓ Your lineup is already optimal</div>';
  h += '<h4>Waiver wire</h4>';
  h += L.waivers.length
    ? L.waivers.map((w) => `<div class="move"><span class="in">+ ${esc(w.name)}</span> <span class="muted">${esc(w.pos)} · ${num(w.value)} pts/wk${w.upgradeOver > 0 ? ` · +${num(w.upgradeOver)} over your starter` : ''}${w.drop ? ` · drop ${esc(w.drop.name)}?` : ''}</span></div>`).join('')
    : '<div class="muted">Nothing on waivers beats what you have.</div>';
  return h;
}

function currentTab(L) {
  const cur = L.lineup.current || [];
  const total = cur.reduce((s, x) => s + (x.player?.proj || 0), 0);
  return `<table><tr><th>Slot</th><th>Your lineup now</th><th class="n">Proj</th></tr>${cur
    .map((x) => `<tr class="${x.benched ? 'out-row' : ''}"><td>${esc(x.slot)}</td><td>${player(x.player)}</td><td class="n">${num(x.player?.proj)}</td></tr>`).join('')}
    <tr><td></td><td><b>Total</b></td><td class="n"><b>${num(total)}</b></td></tr></table>
    <div class="muted" style="margin-top:6px">${cur.some((x) => x.benched) ? 'Red rows are players the Best lineup tab would bench.' : '✓ This is already your best lineup.'}</div>`;
}

function newsTab(L) {
  if (!L.news?.length) return '<div class="muted">No news about your players in the last 5 days.</div>';
  return L.news.map((n) => `<div class="move" style="display:block"><b>${esc(n.player)}</b> <span class="muted">${esc(n.pos)} · ${ago(n.when)}</span><br>${n.url ? `<a href="${esc(n.url)}" target="_blank" rel="noopener" style="color:inherit">${esc(n.headline)}</a>` : esc(n.headline)}${n.blurb ? `<div class="muted">${esc(n.blurb)}</div>` : ''}</div>`).join('');
}

function lineupTab(L) {
  return `<table><tr><th>Slot</th><th>Best lineup</th><th class="n">Proj</th></tr>${L.lineup.best
    .map((x) => `<tr class="${x.changed ? 'chg' : ''}"><td>${esc(x.slot)}</td><td>${player(x.player)}</td><td class="n">${num(x.player?.proj)}</td></tr>`).join('')}
    <tr><td></td><td><b>Total</b></td><td class="n"><b>${num(L.lineup.projected)}</b></td></tr></table>
    <div class="muted" style="margin-top:6px">Green rows are changes from your current lineup.</div>`;
}

function tradesTab(L) {
  if (!L.trades.length) return '<div class="muted">No trade clearly helps both sides right now.</div>';
  const side = (ps) => ps.map((p) => `<div>${player(p)}${p.keeper ? `<span class="kp">Keeper: costs R${p.keeper.cost}, plays like R${p.keeper.marketRound}</span>` : ''}</div>`).join('');
  const fair = (b) => (b == null ? '' : b >= 1.08 ? ' · you win on paper' : b >= 0.93 ? ' · fair on paper' : ' · you pay a little extra');
  return L.trades.map((t) => `<div class="trade"><div class="lbl">With ${esc(t.team)}${fair(t.balance)}</div>
    <div class="sides"><div><div class="lbl">You give</div>${side(t.give)}</div><div><div class="lbl">You get</div>${side(t.get)}</div></div>
    <p>${esc(t.why)}</p><button class="askbtn" data-league="${esc(L.id)}" data-q="${esc(`Grade this trade idea: I give ${t.give.map((p) => p.name).join(' + ')} to ${t.team} for ${t.get.map((p) => p.name).join(' + ')}. Is it fair, and would they take it?`)}">Ask Claude about this</button></div>`).join('');
}

function keeperTab(L) {
  const k = L.keeper;
  return `<div class="muted">You keep ${k.rules.max} player a year; he costs a pick ${k.rules.roundsEarlier} round earlier than where he was drafted.</div>
  <table style="margin-top:8px"><tr><th>Player</th><th class="n">Drafted</th><th class="n">Keep cost</th><th class="n">Plays like</th><th class="n">Surplus</th></tr>
  ${k.candidates.map((c, i) => `<tr class="${i === 0 ? 'me' : ''}"><td>${player(c)}</td><td class="n">${c.draftedRound ? 'R' + c.draftedRound : 'FA'}</td><td class="n">R${c.cost}</td><td class="n">R${c.marketRound}</td><td class="n">${c.surplus ? '+' + c.surplus : '0'}</td></tr>`).join('')}</table>
  <div class="muted" style="margin-top:6px">"Plays like" is where his value ranks among rostered players in this league. ${esc(k.undraftedAssumption)}</div>`;
}

function leagueTab(L) {
  let h = `<table><tr><th>#</th><th>Team</th><th class="n">Record</th><th class="n">PF</th></tr>${L.standings
    .map((s) => `<tr class="${s.name === L.myTeam.name ? 'me' : ''}"><td>${s.rank}</td><td>${teamLink(L, s.id, s.name)}</td><td class="n">${rec(s)}</td><td class="n">${num(s.pf)}</td></tr>`).join('')}</table>`;
  h += '<h4>Recent moves</h4>';
  h += L.transactions.length
    ? L.transactions.map((t) => `<div class="move"><b>${esc(t.type)}</b> ${esc(t.text)} <span class="muted">${ago(t.when)}</span></div>`).join('')
    : '<div class="muted">No recent activity.</div>';
  return h;
}

function card(L, i) {
  if (L.error) return `<div class="card"><div class="card-head"><div class="top"><h3>${esc(L.name)}</h3><span class="tag ${L.platform}">${L.platform}</span></div></div><div class="err">Couldn't load: ${esc(L.error)}</div></div>`;
  const m = L.matchup;
  const tabs = [['Overview', overview], ['My lineup', currentTab], ['Best lineup', lineupTab], ['Trades', tradesTab], ['News', newsTab], ...(L.keeper ? [['Keeper', keeperTab]] : []), ['League', leagueTab]];
  const el = document.createElement('div');
  el.className = 'card';
  el.innerHTML = `<div class="card-head">
      <div class="top"><h3><a href="${esc(L.url)}" target="_blank" rel="noopener">${esc(L.name)}</a></h3>
        <span>${L.keeper ? '<span class="tag keeper">keeper</span> ' : ''}<span class="tag ${L.platform}">${L.platform}</span></span></div>
      <div class="sub">${esc(L.myTeam.name)} · ${rec(L.myTeam)} · ${ordinal(L.myTeam.rank)} of ${L.myTeam.size}${L.ppr != null && L.ppr !== 1 ? ` · <b>${L.ppr} PPR</b>` : ''}</div>
      ${m ? `<div class="score"><span>You <b>${num(m.myPts)}</b></span><span class="muted">vs</span><span>${teamLink(L, m.oppId, m.oppName)} <b>${num(m.oppPts)}</b></span></div>
      <div class="sub">Projected: you ${num(m.myProj)} · them ${num(m.oppProj)} · ${winText(m)}</div>
      <div class="win"><div style="width:${m.winPct}%"></div></div>` : ''}
    </div>
    <div class="tabs">${tabs.map(([n], j) => `<button data-t="${j}" class="${j ? '' : 'on'}">${n}${n === 'Trades' && L.trades.length ? ` (${L.trades.length})` : ''}${n === 'News' && L.news?.length ? ` (${L.news.length})` : ''}</button>`).join('')}</div>
    <div class="pane"></div>`;
  const pane = $('.pane', el);
  const show = (j) => { pane.innerHTML = tabs[j][1](L); el.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', +b.dataset.t === j)); };
  el.querySelectorAll('.tabs button').forEach((b) => (b.onclick = () => show(+b.dataset.t)));
  show(0);
  return el;
}

const ordinal = (n) => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');

function todo(data) {
  const items = [];
  for (const L of data.leagues) {
    if (L.error) { items.push(`<b>${esc(L.name)}</b>: couldn't load (${esc(L.error)})`); continue; }
    for (const a of L.alerts.filter((a) => a.level === 'bad')) items.push(`<b>${esc(L.name)}</b>: ${esc(a.text)}`);
    if (L.lineup.moves.length) items.push(`<b>${esc(L.name)}</b>: ${L.lineup.moves.length} lineup change${L.lineup.moves.length > 1 ? 's' : ''} worth +${num(L.lineup.gain)} pts (start ${L.lineup.moves.map((m) => esc(m.in.name)).join(', ')})`);
  }
  const trades = data.leagues.reduce((s, L) => s + (L.trades?.length || 0), 0);
  return `<div class="todo"><h2>${items.length ? 'To do before kickoff' : '✓ All lineups look good'}</h2>${items.length ? `<ul>${items.map((i) => `<li>${i}</li>`).join('')}</ul>` : ''}
    <div class="muted" style="margin-top:6px">${trades} trade idea${trades === 1 ? '' : 's'} across your leagues. Projections are PPR from Sleeper, ESPN's own for ESPN lineups.</div></div>`;
}

async function load() {
  $('#loading').style.display = '';
  $('#app').innerHTML = '';
  try {
    const data = await api('/api/dashboard');
    if (data.error) throw new Error(data.error);
    $('#meta').textContent = `Week ${data.week} · ${data.season} · updated ${new Date(data.generatedAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
    const app = $('#app');
    app.innerHTML = todo(data);
    const grid = document.createElement('div');
    grid.className = 'grid';
    data.leagues.forEach((L, i) => { const c = card(L, i); grid.append(typeof c === 'string' ? Object.assign(document.createElement('div'), { innerHTML: c }).firstElementChild : c); });
    app.append(grid);
    setupAsk(data);
    DATA = data;
    renderView();
  } catch (e) {
    $('#app').innerHTML = `<div class="err">Couldn't load your leagues: ${esc(e.message)}</div>`;
  } finally {
    $('#loading').style.display = 'none';
  }
}
// ---- Shared bits for the new views ----
let DATA = null;
let VIEW = 'home';
let MU = 0;
let TV = 0;
const okLeagues = () => (DATA ? DATA.leagues.filter((L) => !L.error) : []);

function winText(m) {
  const cls = m.winPct >= 55 ? 'up' : m.winPct <= 45 ? 'down' : '';
  return `<span class="pct ${cls}">You ${m.winPct}%</span> <span class="muted">· them ${100 - m.winPct}% to win</span>${m.bestWinPct ? ` <span class="muted">(${m.bestWinPct}% with best lineup)</span>` : ''}`;
}

function teamLink(L, id, name) {
  return `<button class="team" data-league="${esc(L.id)}" data-team="${esc(id)}">${esc(name)}</button>`;
}

// Roster pop-up for any team.
function openRoster(leagueId, teamId) {
  const L = okLeagues().find((x) => x.id === leagueId);
  const t = L?.teams?.find((x) => String(x.id) === String(teamId));
  if (!t) return;
  $('#rtitle').textContent = `${t.name} · ${rec(t)}`;
  const rows = ['QB', 'RB', 'WR', 'TE', 'K', 'DEF'].filter((pos) => t.byPos[pos]?.length).map((pos) =>
    `<tr><th colspan="3" style="padding-top:10px">${pos}${t.ranks?.[pos] ? ` <span class="muted">· ${ordinal(t.ranks[pos])} of ${L.teams.length} in league</span>` : ''}</th></tr>` +
    t.byPos[pos].map((p) => `<tr><td>${p.starter ? '<b>' : ''}${esc(p.name)}${p.starter ? '</b>' : ''} <span class="muted">${esc(p.nfl)}</span>${p.injury ? `<span class="inj">${esc(p.injury)}</span>` : ''}</td><td class="n">${num(p.value)}<span class="muted"> /wk</span></td><td class="n">${p.pts != null ? num(p.pts) + '<span class="muted"> now</span>' : ''}</td></tr>`).join('')).join('');
  $('#rbody').innerHTML = `${t.needs.length ? t.needs.map((n) => `<span class="chip need">Weak at ${n}</span>`).join('') : ''}${t.surplus.map((n) => `<span class="chip deep">Deep at ${n}</span>`).join('')}
    <table style="margin-top:6px">${rows}</table><div class="muted" style="margin-top:8px">Bold = in their starting lineup. /wk = projected points per game going forward.</div>`;
  $('#roster').showModal();
}
$('#rclose').onclick = () => $('#roster').close();
$('#roster').addEventListener('click', (e) => { if (e.target === $('#roster')) $('#roster').close(); });
document.addEventListener('click', (e) => {
  const b = e.target.closest('button.team');
  if (b) openRoster(b.dataset.league, b.dataset.team);
});

// View switching (Dashboard / Matchups / Trade view), remembered in the URL.
function setView(v) {
  VIEW = v;
  try { history.replaceState(null, '', v === 'home' ? location.pathname : `#${v}`); } catch {}
  document.querySelectorAll('nav.views button').forEach((b) => b.classList.toggle('on', b.dataset.v === v));
  renderView();
}
document.querySelectorAll('nav.views button').forEach((b) => (b.onclick = () => setView(b.dataset.v)));
VIEW = ['matchups', 'trades'].includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home';
document.querySelectorAll('nav.views button').forEach((b) => b.classList.toggle('on', b.dataset.v === VIEW));
window.addEventListener('hashchange', () => {
  const v = location.hash.slice(1);
  setView(['matchups', 'trades'].includes(v) ? v : 'home');
});

function renderView() {
  $('#app').hidden = VIEW !== 'home';
  $('#ask').hidden = VIEW !== 'home' || !DATA;
  $('#mview').hidden = VIEW !== 'matchups';
  $('#tview').hidden = VIEW !== 'trades';
  if (!DATA) return;
  if (VIEW === 'matchups') renderMatchups();
  if (VIEW === 'trades') renderTrades();
}

function switcher(list, idx, id) {
  return `<div class="switch"><button data-step="-1" data-sw="${id}">◀</button><select data-sw="${id}">${list.map((L, i) => `<option value="${i}" ${i === idx ? 'selected' : ''}>${esc(L.name)}</option>`).join('')}</select><button data-step="1" data-sw="${id}">▶</button></div>`;
}
function wireSwitcher(root, list, get, set, render) {
  root.querySelectorAll('[data-step]').forEach((b) => (b.onclick = () => { set((get() + Number(b.dataset.step) + list.length) % list.length); render(); }));
  root.querySelector('select').onchange = (e) => { set(Number(e.target.value)); render(); };
}

// ---- Matchups view ----
function renderMatchups() {
  const list = okLeagues().filter((L) => L.matchup);
  const root = $('#mview');
  if (!list.length) { root.innerHTML = '<div class="panel muted">No matchups this week.</div>'; return; }
  MU = Math.min(MU, list.length - 1);
  const L = list[MU];
  const m = L.matchup;
  const me = L.teams.find((t) => t.mine);
  const cell = (r, side) => {
    if (!r || !r.player) return side === 'l' ? '<td><span class="muted">empty</span></td><td></td>' : '<td></td><td class="r"><span class="muted">empty</span></td>';
    const live = r.state === 'in';
    const inner = `${esc(r.player.name)}${r.player.injury ? `<span class="inj">${esc(r.player.injury)}</span>` : ''}<span class="g ${live ? 'live' : ''}">${esc(r.player.pos)} · ${esc(r.game)}${r.proj != null ? ` · proj ${num(r.proj)}` : ''}</span>`;
    const pts = `<span class="p">${num(r.pts)}</span>`;
    return side === 'l' ? `<td>${inner}</td><td class="r">${pts}</td>` : `<td>${pts}</td><td class="r">${inner}</td>`;
  };
  const n = Math.max(m.myRows.length, m.oppRows.length);
  let rows = '';
  for (let i = 0; i < n; i++) rows += `<tr>${cell(m.myRows[i], 'l')}<td class="slot">${esc((m.myRows[i] || m.oppRows[i]).slot)}</td>${cell(m.oppRows[i], 'r')}</tr>`;
  root.innerHTML = `${switcher(list, MU, 'mu')}
    <div class="panel">
      <div class="mu-head">
        <div><div class="muted">${esc(me.name)}</div><div class="big">${num(m.myPts)}</div><div class="muted">proj ${num(m.myProj)}</div></div>
        <div class="muted">vs</div>
        <div><div class="muted">${teamLink(L, m.oppId, m.oppName)}</div><div class="big">${num(m.oppPts)}</div><div class="muted">proj ${num(m.oppProj)}</div></div>
      </div>
      <div style="text-align:center;margin-top:8px">${winText(m)}</div>
      <div class="win"><div style="width:${m.winPct}%"></div></div>
      <table class="mu" style="margin-top:12px">${rows}</table>
      <div class="muted" style="margin-top:8px">Points update every time you refresh. Win % blends points scored so far with projections for games still to play.</div>
    </div>`;
  wireSwitcher(root, list, () => MU, (v) => (MU = v), renderMatchups);
}

// ---- Trade view ----
function renderTrades() {
  const list = okLeagues().filter((L) => L.teams);
  const root = $('#tview');
  if (!list.length) return;
  TV = Math.min(TV, list.length - 1);
  const L = list[TV];
  const teams = [...L.teams].sort((a, b) => (b.mine - a.mine) || (b.partner ? 1 : 0) - (a.partner ? 1 : 0));
  const size = L.teams.length;
  const card = (t) => {
    const pos = ['QB', 'RB', 'WR', 'TE'].map((p) => {
      const weak = t.needs.includes(p);
      const players = (t.byPos[p] || []).slice(0, 6).map((x) => `<span class="pl ${x.starter ? 'st' : ''}">${esc(x.name)} <span class="muted">${num(x.value)}</span>${x.injury ? `<span class="inj">${esc(x.injury.slice(0, 1))}</span>` : ''}</span>`).join(' ');
      return `<div class="posrow ${weak ? 'weak' : ''}"><div class="lbl2">${p}<span class="rk">${t.ranks?.[p] ? `${t.ranks[p]}/${size}` : ''}</span></div><div>${players || '<span class="muted">none</span>'}</div></div>`;
    }).join('');
    const chips = t.needs.map((n) => `<span class="chip need">Weak at ${n}</span>`).join('') + t.surplus.map((n) => `<span class="chip deep">Deep at ${n}</span>`).join('') +
      (t.partner ? `<span class="chip partner">Trade fit: your ${t.partner.give.join('/')} for their ${t.partner.get.join('/')}</span>` : '');
    return `<div class="tcard ${t.mine ? 'mine' : ''}"><h3>${teamLink(L, t.id, t.name)}${t.mine ? ' <span class="muted">(you)</span>' : ''}</h3><div class="muted">${rec(t)} · ${num(t.pf)} PF</div><div>${chips}</div><div style="margin-top:6px">${pos}</div></div>`;
  };
  root.innerHTML = `${switcher(list, TV, 'tv')}
    <div class="muted" style="margin-bottom:10px">Each position lists players best to worst with their projected points per game. Bold = starting. The number under each position is that team's league rank there. Red rows are weak spots (bottom 30% of the league); "Deep at" means their first bench player would start for most teams. Teams that fit a trade with you are listed first.</div>
    <div class="tgrid">${teams.map(card).join('')}</div>`;
  wireSwitcher(root, list, () => TV, (v) => (TV = v), renderTrades);
}

// Calls our server, asking for the site password once if one is set.
async function api(url, body) {
  let key = '';
  try { key = localStorage.getItem('ffkey') || ''; } catch {}
  const go = () => fetch(url, body
    ? { method: 'POST', headers: { 'content-type': 'application/json', 'x-dashboard-key': key }, body: JSON.stringify(body) }
    : { cache: 'no-store', headers: { 'x-dashboard-key': key } });
  let res = await go();
  if (res.status === 401) {
    key = prompt('Password') || '';
    try { localStorage.setItem('ffkey', key); } catch {}
    res = await go();
  }
  return res.json();
}

// ---- Ask Claude ----
let chat = [];
function md(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/^#+ (.*)$/gm, '<b>$1</b>').replace(/^[-*] /gm, '• ');
}
function renderChat() {
  $('#thread').innerHTML = chat.map((m) => `<div class="msg ${m.role === 'user' ? 'you' : 'claude'}">${m.role === 'user' ? esc(m.content) : md(m.content)}</div>`).join('');
}
function setupAsk(data) {
  const sel = $('#lg');
  const prev = sel.value;
  sel.innerHTML = data.leagues.map((L) => `<option value="${esc(L.id)}">${esc(L.name)}</option>`).join('');
  copyMode = !data.askEnabled;
  if (copyMode) {
    sel.insertAdjacentHTML('afterbegin', '<option value="all">All 6 leagues</option>');
    $('#send').textContent = 'Copy for Claude';
    $('#clear').hidden = true;
    $('#askhelp').textContent = 'Type a question or paste a trade offer, then tap Copy. It copies your question plus every roster in that league, so you can paste it into a Claude chat.';
  }
  if (prev) sel.value = prev;
  $('#ask').hidden = false;
  if (copyMode) prefetchBrief();
}

// Copy mode (no API key): fetch the league brief ahead of time so the copy
// happens right on the tap, which phones require for clipboard access.
let copyMode = false;
const briefs = {};
async function prefetchBrief() {
  const id = $('#lg').value;
  if (briefs[id]) return;
  let key = '';
  try { key = localStorage.getItem('ffkey') || ''; } catch {}
  briefs[id] = fetch(`/api/context?league=${encodeURIComponent(id)}`, { headers: { 'x-dashboard-key': key } }).then((r) => r.text());
  briefs[id] = await briefs[id];
}
async function copyBrief() {
  const id = $('#lg').value;
  const q = $('#q').value.trim();
  if (typeof briefs[id] !== 'string') { $('#copied').textContent = 'Still loading that league, tap again in a second.'; prefetchBrief(); return; }
  const text = `${briefs[id]}\n\n# My question\n${q || '(I will ask my question in my next message.)'}`;
  try {
    await navigator.clipboard.writeText(text);
    $('#copied').innerHTML = '✓ Copied. Paste it into a <a href="https://claude.ai/new" target="_blank" rel="noopener">new Claude chat</a> (or this project) and send.';
  } catch {
    $('#q').value = text;
    $('#q').select();
    $('#copied').textContent = "Couldn't copy automatically. Everything is selected in the box above; copy it manually.";
  }
}
// Trade cards are drawn when their tab opens, so listen at the document level.
document.addEventListener('click', (e) => {
  const b = e.target.closest('.askbtn');
  if (!b) return;
  if ($('#lg').value !== b.dataset.league) { chat = []; renderChat(); }
  $('#lg').value = b.dataset.league;
  $('#q').value = b.dataset.q;
  $('#copied').textContent = '';
  if (copyMode) prefetchBrief();
  $('#ask').scrollIntoView({ behavior: 'smooth' });
  $('#q').focus();
});
$('#lg').onchange = () => { chat = []; renderChat(); $('#copied').textContent = ''; if (copyMode) prefetchBrief(); };
$('#clear').onclick = () => { chat = []; renderChat(); $('#q').value = ''; };
$('#send').onclick = async () => {
  if (copyMode) return copyBrief();
  const q = $('#q').value.trim();
  if (!q) return;
  chat.push({ role: 'user', content: q });
  $('#q').value = '';
  renderChat();
  $('#thread').insertAdjacentHTML('beforeend', '<div class="msg claude muted" id="thinking">Thinking it over…</div>');
  $('#send').disabled = true;
  try {
    const r = await api('/api/ask', { leagueId: $('#lg').value, messages: chat });
    if (r.error) throw new Error(r.error);
    chat.push({ role: 'assistant', content: r.answer });
  } catch (e) {
    chat.pop();
    $('#q').value = q;
    renderChat();
    $('#thread').insertAdjacentHTML('beforeend', `<div class="msg err">${esc(e.message)}</div>`);
    return;
  } finally {
    $('#send').disabled = false;
  }
  renderChat();
};

$('#refresh').onclick = load;
load();
</script>
